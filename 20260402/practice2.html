<!-- eventListener -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="name-input" placeholder="이름입력...">
    <p id="preview"></p>

    <script>
        // 텍스트입력시 입력한내용을 곧바로 preview로 보여줌
        const input = document.querySelector("#name-input")
        const preview = document.querySelector("#preview")

        function previewInput() {
            if (input.value.length <= 8) {
                preview.textContent = "비밀번호는 8자리 이상이어야합니다"
                preview.style.color = "red"
            } else {
                preview.textContent = "사용가능한 비밀번호 입니다"
                preview.style.color = "green"
            };

            // preview.textContent = input.value;
        };

        // input event : 값을 입력하는순간 발생
        input.addEventListener("input", previewInput)
    </script>
</body>
</html>
