<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--돔이란? 임시html 같은것?, 새로고침하면 사라진다 다시 html 기준으로 불러오니까, 
        ex)이걸 이용하여 사용자에게 개인화된 구성을 해줄수있다
        ex)다크모드
        document.getElementById -->
    <h1 id="text"> Hello, DOM</h1>

    <!-- document.querySelector(".hello") : class
         document.querySelector("#hello") : id
         document.querySelector("hello")  :태그
         클래스,id,태그 등이 중복으로 쓰였을경우 첫번째것만 찾아줌
         document.querySelectorAll(".hello") : 모두찾아줌
         -->
    <h1 class="hello">H1 Hello</h1>
    <div class="hello">Div Hello</div>
    <h1 class="hi">H1 Hi</h1>
    <a href="https://google.com">Visit Google</a>
</body>
</html>
