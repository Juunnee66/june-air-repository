<!-- click eventListener 연습 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 class="text">Hello</h1>
    <button id="change">변경</button>

    <script>
        // 텍스트내용, 색 바뀜 버튼
        // const h1 = document.querySelector(".text")
        // const button = document.querySelector("#change")

        // function changeH1() {
        //     h1.textContent = "Hello, JS"
        //     h1.style.color = "red"
        // }
        // button.addEventListener("click", changeH1());

        
        //토글로 구현하기
        const h1 = document.querySelector(".text")
        const button = document.querySelector("#change")
        
        let isChanged = false;

        function changeH1() {
            if (isChanged) {
                h1.textContent = "Hello, JS";
                h1.style.color = "red";
            } else {
                h1.textContent = "Hello";
                h1.style.color = "balck";
            }
            isChanged = !isChanged;
        }
        button.addEventListener("click", changeH1());
    </script>
</body>
</html>
