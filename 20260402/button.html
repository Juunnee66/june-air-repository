<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" class="name-input">
    <button>확인</button>

    <script> /* 자동으로 실행됨 */
        const input = document.querySelector(".name-input")
        const button = document.querySelector("button")

        function printInput() {
            if (input.value.trim() === ""){
                alert("입력값이 비어있습니다.")
            };

            console.log(input.value); /* input칸에 적힌값을 출력 */
        }
        
        // DOM에 등록함 : 버튼이 눌리면 printInput이 실행되도록함
        button.addEventListener("click", printInput);

        // 프론트엔드 개발자로서의 업무
        // 함수정의, eventListener 등록


    </script>

</body>
</html>
